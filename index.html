<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Marble Maze Prototype</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background: #111;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            width: 100%;
            max-width: 430px;
            height: 100%;
            max-height: 932px;
            position: relative;
            background: #1a1a2e;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
        }
        canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px;
        }
        .header, .footer {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: auto;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .footer {
            justify-content: center;
            gap: 15px;
        }
        button {
            background: #ff5722;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            pointer-events: auto;
            box-shadow: 0 4px 10px rgba(255,87,34,0.4);
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.95); }
        #clear-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            pointer-events: auto;
            z-index: 10;
        }
        #clear-overlay h1 {
            color: #4CAF50;
            font-size: 32px;
            text-shadow: 0 0 10px rgba(76,175,80,0.5);
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="ui-layer">
        <div class="header">
            <div><strong>Creator:</strong> Takuya</div>
            <div><strong>Time:</strong> <span id="timer">00.00</span>s</div>
        </div>
        <div class="footer">
            <button id="jump-btn">⚡ JUMP / SHAKE</button>
            <button id="goal-btn">🏁 GOAL TEST</button>
        </div>
    </div>

    <div id="clear-overlay">
        <h1>STAGE CLEAR!</h1>
        <p id="clear-time-text">Time: 00.00s</p>
        <button id="share-btn">📤 SHARE VIDEO (0s WAIT)</button>
        <button id="retry-btn">🔄 RETRY</button>
    </div>
</div>

<!-- Three.js & Rapier CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.11.2/rapier.js"></script>

<script>
let RAPIER;
let world, physicsTimer = 0;
let scene, camera, renderer;
let balls = [], walls = [];
let boardGroup;
let tiltX = 0, targetTiltX = 0;
let tiltZ = 0, targetTiltZ = 0;
let isStarted = false;
let startTime = 0, elapsedTime = 0;
let isCleared = false;

// 録画用変数
let mediaRecorder;
let recordedChunks = [];
let replayLog = []; // Float32Array記録用
let logIndex = 0;
const MAX_LOG_FRAMES = 18000; // 5分間分 (60fps)
const floatLog = new Float32Array(MAX_LOG_FRAMES * 5); // tiltX, tiltZ, ball1(x,z), ball2(x,z)...

async function init() {
    await RAPIER.init();
    RAPIER.world = new RAPIER.World({ x: 0.0, y: -9.81, z: 0.0 });
    world = RAPIER.world;

    const container = document.getElementById('game-container');
    const width = container.clientWidth;
    const height = container.clientHeight;

    // Three.js セットアップ
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b0b16);

    camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
    camera.position.set(0, 14, 10);
    camera.lookAt(0, 0, 0);

    renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(width, height);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    container.insertBefore(renderer.domElement, container.firstChild);

    // ライティング (光漏れ＆リアル調)
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffeedd, 0.8);
    dirLight.position.set(5, 15, 5);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // 盤面グループ (傾き描画用)
    boardGroup = new THREE.Group();
    scene.add(boardGroup);

    createStage();
    setupEvents();
    startRecording();

    startTime = performance.now();
    isStarted = true;

    animate();
}

function createStage() {
    // 盤面ベース（レトロ・スケルトン・プラスチック風）
    const boardWidth = 6, boardHeight = 10;
    const floorGeo = new THREE.BoxGeometry(boardWidth, 0.4, boardHeight);
    const floorMat = new THREE.MeshPhysicalMaterial({
        color: 0x1e88e5,
        roughness: 0.2,
        metalness: 0.1,
        transmission: 0.6, // 透過・スケルトン質感
        thickness: 1.2
    });
    const floorMesh = new THREE.Mesh(floorGeo, floorMat);
    floorMesh.position.y = -0.2;
    floorMesh.receiveShadow = true;
    boardGroup.add(floorMesh);

    // 物理床
    const groundBodyDesc = RAPIER.RigidBodyDesc.fixed().translate({ x: 0, y: -0.4, z: 0 });
    const groundBody = world.createRigidBody(groundBodyDesc);
    const groundColliderDesc = RAPIER.ColliderDesc.cuboid(boardWidth/2, 0.2, boardHeight/2);
    world.createCollider(groundColliderDesc, groundBody);

    // 周囲の壁
    createWall(0, 0.5, -boardHeight/2, boardWidth, 1, 0.4);
    createWall(0, 0.5, boardHeight/2, boardWidth, 1, 0.4);
    createWall(-boardWidth/2, 0.5, 0, 0.4, 1, boardHeight);
    createWall(boardWidth/2, 0.5, 0, 0.4, 1, boardHeight);

    // 内部の障害物（迷路の壁）
    createWall(-1.5, 0.5, -2, 2, 1, 0.4);
    createWall(1.5, 0.5, 1, 2, 1, 0.4);

    // 模様付きの玉（3個）
    const ballRadius = 0.35;
    const ballColors = [0xff5722, 0x4CAF50, 0xffeb3b];
    const ballPositions = [{x: -2, z: -3}, {x: 0, z: -3}, {x: 2, z: -3}];

    ballPositions.forEach((pos, idx) => {
        // 物理球
        const bodyDesc = RAPIER.RigidBodyDesc.dynamic()
            .translate({ x: pos.x, y: 1.0, z: pos.z })
            .linearDamping(0.5)
            .angularDamping(0.5);
        const body = world.createRigidBody(bodyDesc);
        const colliderDesc = RAPIER.ColliderDesc.ball(ballRadius).restitution(0.6).friction(0.2);
        world.createCollider(colliderDesc, body);

        // 3D球 (模様付き風マテリアル ＋ 微発光PointLight)
        const geo = new THREE.SphereGeometry(ballRadius, 32, 32);
        const mat = new THREE.MeshStandardMaterial({
            color: ballColors[idx],
            roughness: 0.3,
            metalness: 0.2
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.castShadow = true;
        scene.add(mesh);

        // 玉の微発光（暗闇をうっすら照らす）
        const light = new THREE.PointLight(ballColors[idx], 0.5, 3.0);
        mesh.add(light);

        balls.push({ body, mesh });
    });
}

function createWall(x, y, z, sx, sy, sz) {
    const bodyDesc = RAPIER.RigidBodyDesc.fixed().translate({ x, y, z });
    const body = world.createRigidBody(bodyDesc);
    const colliderDesc = RAPIER.ColliderDesc.cuboid(sx/2, sy/2, sz/2);
    world.createCollider(colliderDesc, body);

    const geo = new THREE.BoxGeometry(sx, sy, sz);
    const mat = new THREE.MeshPhysicalMaterial({
        color: 0x90caf9,
        roughness: 0.4,
        metalness: 0.1,
        transmission: 0.4
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x, y, z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    boardGroup.add(mesh);
}

function setupEvents() {
    // マルチタッチ＆マウスでの傾き操作
    let isDragging = false;
    let prevX = 0, prevY = 0;

    window.addEventListener('pointerdown', (e) => {
        isDragging = true;
        prevX = e.clientX;
        prevY = e.clientY;
    });

    window.addEventListener('pointermove', (e) => {
        if (!isDragging || isCleared) return;
        const dx = e.clientX - prevX;
        const dy = e.clientY - prevY;

        targetTiltZ += dx * 0.005;
        targetTiltX += dy * 0.005;

        // 傾きの限界制限 (最大約18度)
        targetTiltZ = Math.max(-0.3, Math.min(0.3, targetTiltZ));
        targetTiltX = Math.max(-0.3, Math.min(0.3, targetTiltX));

        prevX = e.clientX;
        prevY = e.clientY;
    });

    window.addEventListener('pointerup', () => { isDragging = false; });

    // 跳ね上げ (JUMP / SHAKE) ボタン
    document.getElementById('jump-btn').addEventListener('click', triggerJump);
    document.getElementById('goal-btn').addEventListener('click', triggerGoal);
    document.getElementById('retry-btn').addEventListener('click', () => location.reload());
}

function triggerJump() {
    if (isCleared) return;
    balls.forEach(b => {
        // 上方向へインパルス（ジャンプ）
        b.body.applyImpulse({ x: 0, y: 4.5, z: 0 }, true);
    });
}

function triggerGoal() {
    if (isCleared) return;
    isCleared = true;
    if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
    }
    document.getElementById('clear-time-text').innerText = `Time: ${((performance.now() - startTime)/1000).toFixed(2)}s`;
    document.getElementById('clear-overlay').style.display = 'flex';
}

function startRecording() {
    const canvas = renderer.domElement;
    const stream = canvas.captureStream(30); // 30fps
    try {
        mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
    } catch (e) {
        mediaRecorder = new MediaRecorder(stream);
    }

    recordedChunks = [];
    mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) recordedChunks.push(e.data);
    };
    mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        document.getElementById('share-btn').onclick = () => {
            const a = document.createElement('a');
            a.href = url;
            a.download = 'marble_maze_clear.webm';
            a.click();
        };
    };
    mediaRecorder.start();
}

function animate() {
    requestAnimationFrame(animate);

    if (!isCleared && isStarted) {
        // 物理演算のステップ更新
        world.step();

        // 傾きの滑らか補間 (Lerp)
        tiltX += (targetTiltX - tiltX) * 0.1;
        tiltZ += (targetTiltZ - tiltZ) * 0.1;

        // 盤面自体の3D描画傾きを連動
        boardGroup.rotation.x = tiltX;
        boardGroup.rotation.z = -tiltZ;

        // 重力ベクトルを盤面の傾きに合わせて動かす
        world.gravity = {
            x: Math.sin(tiltZ) * 9.81,
            y: -Math.cos(tiltX) * Math.cos(tiltZ) * 9.81,
            z: Math.sin(tiltX) * 9.81
        };

        // 玉の位置・回転（クォータニオン）を物理から同期 (負荷ゼロ)
        balls.forEach(b => {
            const pos = b.body.translation();
            const rot = b.body.rotation();
            b.mesh.position.set(pos.x, pos.y, pos.z);
            b.mesh.quaternion.set(rot.x, rot.y, rot.z, rot.w);
        });

        // タイマー更新
        const currentSeconds = ((performance.now() - startTime) / 1000).toFixed(2);
        document.getElementById('timer').innerText = currentSeconds;
    }

    renderer.render(scene, camera);
}

window.onload = init;
</script>

</body>
</html>
